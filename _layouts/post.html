---
layout: default
---
<article class="post-content">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &bull; {{ page.author }}{% endif %}</p>
    
    {{ content }}
    
    <div class="back-link">
        <a href="{{ '/blog' | relative_url }}">&larr; Back to all posts</a>
    </div>
</article>
