---
layout: default
---
<section class="hero">
  <div class="container">
    <div class="hero-content">
      <p class="hero-tagline">{{ page.date | date: "%B %-d, %Y" }}{% if page.author %} &bull; {{ page.author }}{% endif %}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </div>
</section>

<section>
  <div class="container">
    <article style="max-width: 800px; line-height: 1.8;">
      {{ content }}
      
      <div style="margin-top: 3em; padding-top: 1.5em; border-top: 1px solid rgba(255,255,255,0.1);">
        <a href="{{ '/blog/' | relative_url }}">&larr; Back to all blog posts</a>
      </div>
    </article>
  </div>
</section>
